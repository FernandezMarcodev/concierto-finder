services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?definí POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?definí POSTGRES_DB en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Puerto publicado para herramientas locales (psql/DBeaver).
      # Dentro de la red de Docker la app siempre usa db:5432.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SCRAPER_TOKEN: ${SCRAPER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # El healthcheck está definido en el Dockerfile.

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${WEB_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "5173:5173"

volumes:
  pgdata: