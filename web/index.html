<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El logo es negro: en pestañas oscuras se usa la versión blanca -->
    <link rel="icon" type="image/png" href="/logo.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/logo-blanco.png" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Concierto Finder</title>
    <script>
      // Aplica el tema antes del primer pintado para evitar un destello del tema equivocado.
      // La lógica completa está en src/hooks/useTema.js (misma clave "tema").
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("tema");
        } catch (e) {}
        if (tema !== "claro" && tema !== "oscuro") {
          tema = window.matchMedia("(prefers-color-scheme: light)").matches ? "claro" : "oscuro";
        }
        document.documentElement.dataset.tema = tema;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
